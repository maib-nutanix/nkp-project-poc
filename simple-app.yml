# simple-app.yaml used for proj 02

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkp-project-app
  namespace: project-00001
spec:
  replicas: 10
  selector:
    matchLabels:
      app: nkp-project-app
  template:
    metadata:
      labels:
        app: nkp-project-app
    spec:
      containers:
      - name: web
        image: maib/simple-python-app:v0.1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: nkp-project-app-service
  namespace: project-00001
spec:
  type: ClusterIP
  selector:
    app: nkp-project-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  generation: 1
  name: simple-python-app-ingress
  namespace: project-00001
spec:
  rules:
  - host: my-simple-python-app.local
    http:
      paths:
      - backend:
          service:
            name: nkp-project-app-service
            port:
              number: 80
        path: /
        pathType: Prefix
